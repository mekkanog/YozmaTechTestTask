[pytest]
addopts = -ra --strict-markers --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
testpaths = tests
junit_family = legacy
markers =
    functional: core API behavior
    security: authentication and tenant segregation
    contract: validates responses against the published OpenAPI contract
    validation: request validation, errors, and boundaries
    tenant: verifies tenant data isolation
    load: verifies the minimum throughput requirement
